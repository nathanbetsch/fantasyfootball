<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fantasy">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>{% block title %}Fantasy{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23007aff'/%3E%3Cellipse cx='50' cy='50' rx='34' ry='21' transform='rotate(-35 50 50)' fill='white'/%3E%3C/svg%3E">
  <style>{{ css|safe }}</style>
</head>
<body>
{% block content %}{% endblock %}

<p class="updated">Updated {{ updated }}{% if static %} · refreshes every 30 min (paused 1–8 AM ET){% endif %}</p>

<div class="tabbar">
  <nav>
    {% for t in tabs %}
    <a href="{{ t.href }}" class="{{ 'on' if t.active }}">
      {% if t.icon == 'news' %}
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="5" width="16" height="18" rx="2.5"/><path d="M20 10h2.5a1.5 1.5 0 0 1 1.5 1.5V20a3 3 0 0 1-3 3H7" /><path d="M8 10h8M8 14h8M8 18h5" stroke-linecap="round"/></svg>
      {% else %}
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="14" cy="14" rx="11" ry="6.8" transform="rotate(-40 14 14)"/><path d="M10.5 17.5l7-7M12 13.4l1.6 1.6M13.9 11.5l1.6 1.6M15.8 9.6l1.6 1.6"/></svg>
      {% endif %}
      <span>{{ t.label }}</span>
    </a>
    {% endfor %}
  </nav>
</div>
</body>
</html>
